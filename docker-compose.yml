services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artmarket-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - uploads_data:/app/uploads
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: 3001
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-production}
      VITE_CONTRACT_ADDRESS: ${VITE_CONTRACT_ADDRESS:-0x0000000000000000000000000000000000000000}
      VITE_SEPOLIA_RPC_URL: ${VITE_SEPOLIA_RPC_URL:-https://sepolia.infura.io/v3/your-key}
      UPLOADS_DIR: /app/uploads
    networks:
      - art-marketplace

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_CONTRACT_ADDRESS: ${VITE_CONTRACT_ADDRESS:-0x0000000000000000000000000000000000000000}
        VITE_CHAIN_ID: ${VITE_CHAIN_ID:-11155111}
        VITE_SEPOLIA_RPC_URL: ${VITE_SEPOLIA_RPC_URL:-https://sepolia.infura.io/v3/your-key}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://backend:3001}
    container_name: artmarket-frontend
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_started
    networks:
      - art-marketplace

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: artmarket-cloudflared
    depends_on:
      - frontend
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:-}
    networks:
      - art-marketplace
    profiles:
      - tunnel

volumes:
  uploads_data:

networks:
  art-marketplace:
    driver: bridge
