services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artmarket-backend
    restart: unless-stopped
    # No ports — backend is internal only, accessed via the frontend nginx proxy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./uploads:/app/uploads
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3001
      # Asset URIs baked into on-chain listings must use the public-facing URL
      BACKEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Hardcoded to the internal nginx container — nginx overrides the Origin
      # header before proxying, so CORS works regardless of deployment URL
      FRONTEND_URL: http://frontend:8080
      SESSION_SECRET: ${SESSION_SECRET}
      VITE_CONTRACT_ADDRESS: ${VITE_CONTRACT_ADDRESS}
      VITE_SEPOLIA_RPC_URL: ${VITE_SEPOLIA_RPC_URL}
      UPLOADS_DIR: /app/uploads
    networks:
      - art-marketplace

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_CONTRACT_ADDRESS: ${VITE_CONTRACT_ADDRESS}
        VITE_CHAIN_ID: ${VITE_CHAIN_ID:-11155111}
        VITE_SEPOLIA_RPC_URL: ${VITE_SEPOLIA_RPC_URL}
        # Empty = all API calls use relative paths, proxied through nginx
        # This means the frontend works on any domain (localhost or Cloudflare tunnel)
        VITE_BACKEND_URL: ""
    container_name: artmarket-frontend
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_started
    networks:
      - art-marketplace

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: artmarket-cloudflared
    depends_on:
      - frontend
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    networks:
      - art-marketplace

networks:
  art-marketplace:
    driver: bridge
