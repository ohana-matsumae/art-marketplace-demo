upstream backend {
    server backend:3001;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # ── Backend proxy routes ────────────────────────────────────────────────
    # All backend routes are proxied internally. The Origin header is
    # overridden to the backend's expected FRONTEND_URL so CORS always passes,
    # regardless of the public deployment URL (localhost or Cloudflare tunnel).

    location /auth/ {
        proxy_pass http://backend/auth/;
        proxy_set_header Origin http://frontend:8080;
        include /etc/nginx/proxy_params.conf;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /upload {
        proxy_pass http://backend/upload;
        proxy_set_header Origin http://frontend:8080;
        include /etc/nginx/proxy_params.conf;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        proxy_pass http://backend/assets/;
        proxy_set_header Origin http://frontend:8080;
        include /etc/nginx/proxy_params.conf;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /rpc {
        proxy_pass http://backend/rpc;
        proxy_set_header Origin http://frontend:8080;
        include /etc/nginx/proxy_params.conf;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /public/ {
        proxy_pass http://backend/public/;
        proxy_set_header Origin http://frontend:8080;
        include /etc/nginx/proxy_params.conf;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://backend/health;
        proxy_set_header Origin http://frontend:8080;
        include /etc/nginx/proxy_params.conf;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── SPA routing ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1000;
}
